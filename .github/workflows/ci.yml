name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify site assets
        run: npm run verify
